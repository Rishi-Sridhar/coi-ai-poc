    title: Spouse on the tender evaluation committee
    opportunity_summary: Competitive tender for IT systems integration at a state-owned transport operator. SOE relationship Client. Respondent role Manager; not opportunity owner.
    is_owner: "No"
    soe_relationship: Client
    answers:
      <<: *no
      RELATIVE_AT_SOE: "Yes"
      RELATIVE_INFLUENCE: "Yes"
      RELATIVE_INVOLVEMENT_DETAILS: My spouse is a member of the tender evaluation committee that will score all bids for this contract.
      RELATIVE_RELATIONSHIP: Spouse
      RELATIVE_DESIGNATION: Deputy Director, Procurement department
    outcome: CONFLICT
    rationale: The relative holds direct decision-making authority over the procurement (evaluation committee member).
    final_actions: [DISENGAGE_INDIVIDUAL]

