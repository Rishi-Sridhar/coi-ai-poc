# SYNTHETIC PRECEDENTS — demonstration examples only. They do NOT represent EY decisions or policy.
# final_actions: illustrative final action(s) from the synthetic POC action catalogue (config/action_catalog.yaml).
#
# Deliberate gap for the learning demonstration: NO seed encodes
#   RELATIVE_AT_SOE = Yes AND RELATIVE_INFLUENCE = No  (relative at SOE in an unrelated role).
# That pattern is learned live from a reviewer decision (Learning Case A).
# Only two seeds have RELATIVE_AT_SOE = Yes (both with influence = Yes), so a reviewer precedent
# for Case A still ranks in the top 3 for Learning Case C and can be shown as DISTINGUISHED.

_no: &no
  RELATIVE_AT_SOE: "No"
  THIRD_PARTY_INTEREST: "No"
  PRIOR_SOE_EMPLOYMENT: "No"
  IMPROPER_INFORMATION: "No"
  OTHER_CONFLICT: "No"

precedents:
  - id: SYN-001
    created_at: "2026-01-05T09:00:00+00:00"
    title: No disclosures — advisory to state utility
    opportunity_summary: Finance-function advisory for a state-owned utility. SOE relationship Client. Respondent role Consultant; not opportunity owner.
    is_owner: "No"
    soe_relationship: Client
    answers: {<<: *no}
    outcome: NO CONFLICT
    rationale: All declarations are No and no free-text indicates any relationship with the SOE or the opportunity.
    final_actions: [NO_FURTHER_ACTION]

  - id: SYN-002
